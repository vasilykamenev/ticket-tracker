name: deploy
# Publishes the production image to GHCR and, when given the address of a running deployment, smoke-tests it with
# both roles (read only). Starting the container on the chosen Docker host is the one step that depends on the host;
# until a host is chosen the image is built and published here and started by hand:
#   docker run -d --env-file prod.env -p 3000:3000 ghcr.io/<owner>/<repo>:<sha>
on:
  workflow_dispatch:
    inputs:
      smoke_url:
        description: "HTTPS address of a running deployment to smoke-test after publishing (optional)"
        required: false
        default: ""

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    needs: image
    if: ${{ inputs.smoke_url != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test of the deployment (read only, both roles)
        run: |
          docker run --rm \
            -e SMOKE_BASE_URL="${{ inputs.smoke_url }}" \
            -e SMOKE_ADMIN_EMAIL="${{ secrets.SMOKE_ADMIN_EMAIL }}" -e SMOKE_ADMIN_PASSWORD="${{ secrets.SMOKE_ADMIN_PASSWORD }}" \
            -e SMOKE_AGENT_EMAIL="${{ secrets.SMOKE_AGENT_EMAIL }}" -e SMOKE_AGENT_PASSWORD="${{ secrets.SMOKE_AGENT_PASSWORD }}" \
            "${{ needs.image.outputs.image }}" node dist/cli/smoke.js
