name: deploy
# Production delivery. Runs by itself after the `ci` workflow succeeds on `main`, or by hand (Actions > deploy > Run).
#
#   image    builds the production image and publishes it to GHCR (:<sha> and :latest)
#   migrate  applies the database migrations with the MIGRATOR role (the application never has those credentials)
#   deploy   tells the Docker host to pull the new image (optional deploy hook; see below)
#   verify   waits for the deployment and smoke-tests it with both roles, and checks object storage
#
# All steps that touch production use the `production` environment: its secrets, and its protection rules (add
# required reviewers there to make every deployment wait for an approval).
#
# Environment secrets:  DIRECT_URL (migrator role), DATABASE_URL (runtime role), S3_ENDPOINT, S3_REGION, S3_BUCKET,
#                       S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, SMOKE_ADMIN_EMAIL, SMOKE_ADMIN_PASSWORD,
#                       optionally SMOKE_AGENT_EMAIL, SMOKE_AGENT_PASSWORD and DEPLOY_HOOK_URL
# Variable:             PRODUCTION_URL  (https://... of the running application)
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One production deployment at a time; a newer one waits instead of cancelling a running migration.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ github.repository }}:${{ steps.revision.outputs.sha }}
    steps:
      - id: revision
        # The commit CI has just verified (for a manual run, the commit that was selected).
        env:
          REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "sha=$REVISION" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.revision.outputs.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.image.outputs.image }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Require the migrator credentials
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "::error::The production environment has no DIRECT_URL secret (the migrator role). Create the roles with db-provision and add it."
            exit 1
          fi
      - name: Apply the migrations and make sure the system statuses exist
        run: |
          # The schema declares both URLs; for the migration step they are the same migrator connection.
          docker run --rm -e DIRECT_URL -e DATABASE_URL="$DIRECT_URL" "$IMAGE" npx prisma migrate deploy
          docker run --rm -e DATABASE_URL="$DIRECT_URL" "$IMAGE" node dist/cli/seed-reference.js

  deploy:
    needs: [image, migrate]
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
      IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - name: Ask the host to deploy the new image
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::notice::No DEPLOY_HOOK_URL secret: the image $IMAGE is published and migrated; start it on the Docker host."
            exit 0
          fi
          hook="$DEPLOY_HOOK_URL"
          case "$hook" in
            # Render: deploy exactly the image of the verified commit, not whatever :latest points to by then.
            https://api.render.com/deploy/*) hook="${hook}&imgURL=$(printf '%s' "$IMAGE" | jq -sRr @uri)" ;;
          esac
          curl -fsS --max-time 60 -X POST "$hook" >/dev/null
          echo "Deployment requested."

  verify:
    needs: [image, deploy]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.image.outputs.image }}
      SMOKE_BASE_URL: ${{ vars.PRODUCTION_URL }}
      SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
      SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
      SMOKE_AGENT_EMAIL: ${{ secrets.SMOKE_AGENT_EMAIL }}
      SMOKE_AGENT_PASSWORD: ${{ secrets.SMOKE_AGENT_PASSWORD }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Object storage works (writes, reads and deletes small test objects)
        run: docker run --rm -e S3_ENDPOINT -e S3_REGION -e S3_BUCKET -e S3_ACCESS_KEY_ID -e S3_SECRET_ACCESS_KEY "$IMAGE" node dist/cli/storage-check.js
      - name: Wait for the deployment to answer
        run: |
          if [ -z "$SMOKE_BASE_URL" ]; then
            echo "::notice::No PRODUCTION_URL variable: nothing to smoke-test yet."
            exit 0
          fi
          for _ in $(seq 1 40); do
            curl -fsS --max-time 10 "$SMOKE_BASE_URL/health/ready" >/dev/null && exit 0
            sleep 15
          done
          echo "::error::$SMOKE_BASE_URL did not become ready within ten minutes."
          exit 1
      - name: Smoke test with both roles (read only)
        run: |
          [ -n "$SMOKE_BASE_URL" ] || exit 0
          docker run --rm -e SMOKE_BASE_URL -e SMOKE_ADMIN_EMAIL -e SMOKE_ADMIN_PASSWORD -e SMOKE_AGENT_EMAIL -e SMOKE_AGENT_PASSWORD "$IMAGE" node dist/cli/smoke.js
