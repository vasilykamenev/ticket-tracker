name: deploy
# Production delivery to a VPS. Runs by itself after the `secrets-scan` workflow succeeds on a push to `main` (the tests ran on the pull request), or by hand (Actions > deploy > Run).
#
#   image    builds the production image and publishes it to GHCR (:<sha> and :latest)
#   migrate  applies the database migrations with the MIGRATOR role (the application never has those credentials)
#   deploy   copies deploy/vps/ to the server and runs deploy.sh over SSH: pull, start, wait for healthy, roll back if not
#   verify   checks object storage and waits until the deployment answers (no smoke test: it needs accounts of both roles)
#
# All steps that touch production use the `production` environment: its secrets, and its protection rules (add
# required reviewers there to make every deployment wait for an approval).
#
# Environment secrets:  DIRECT_URL (migrator role), DATABASE_URL (runtime role), S3_ENDPOINT, S3_REGION, S3_BUCKET,
#                       S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY
#                       VPS_HOST (address), VPS_USER (deploy), VPS_SSH_KEY (private key), VPS_HOST_KEY (the server's
#                       public host key, from `ssh-keyscan -t ed25519 <address>`: pinned, so nothing can impersonate it)
# Variable:             PRODUCTION_URL  (https://<DOMAIN> of the running application)
# The application's own secrets live on the server, in /opt/ticket-tracker/.env; this workflow never writes them.
on:
  workflow_run:
    workflows: [secrets-scan]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One production deployment at a time; a newer one waits instead of cancelling a running migration.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ github.repository }}:${{ steps.revision.outputs.sha }}
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - id: revision
        # The commit the secret scan has just passed (for a manual run, the commit that was selected).
        env:
          REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "sha=$REVISION" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.revision.outputs.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.image.outputs.image }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Require the migrator credentials
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "::error::The production environment has no DIRECT_URL secret (the migrator role). Create the roles with db-provision and add it."
            exit 1
          fi
      - name: Apply the migrations and make sure the system statuses exist
        run: |
          # The schema declares both URLs; for the migration step they are the same migrator connection.
          docker run --rm -e DIRECT_URL -e DATABASE_URL="$DIRECT_URL" "$IMAGE" npx prisma migrate deploy
          docker run --rm -e DATABASE_URL="$DIRECT_URL" "$IMAGE" node dist/cli/seed-reference.js

  deploy:
    needs: [image, migrate]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.image.outputs.image }}
      REVISION: ${{ needs.image.outputs.revision }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
      # Lets the server pull the private image for this one deployment; it is logged out again at the end.
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REGISTRY_USER: ${{ github.actor }}
    steps:
      - name: Is a server configured?
        id: server
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_HOST_KEY" ]; then
            echo "::notice::No VPS_* secrets: the image $IMAGE is published and migrated; start it on the server."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.server.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REVISION }}
          sparse-checkout: deploy/vps
      - name: Deploy over SSH
        if: steps.server.outputs.configured == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          ssh_opts=(-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20)
          remote="$VPS_USER@$VPS_HOST"

          # The server's configuration follows the repository: the same commit as the image.
          scp "${ssh_opts[@]}" deploy/vps/compose.yaml deploy/vps/Caddyfile deploy/vps/deploy.sh "$remote:/opt/ticket-tracker/"
          # The operator's scripts (admin account, demo data) travel with it; they are run by hand on the server.
          scp -r "${ssh_opts[@]}" deploy/vps/tools "$remote:/opt/ticket-tracker/"
          ssh "${ssh_opts[@]}" "$remote" chmod 755 /opt/ticket-tracker/tools/*.sh

          # The registry user and token travel over the SSH connection's stdin, never in a command line; deploy.sh
          # logs in for this deployment and logs out when it ends, whatever the outcome.
          printf '%s\n%s\n' "$REGISTRY_USER" "$REGISTRY_TOKEN" \
            | ssh "${ssh_opts[@]}" "$remote" bash /opt/ticket-tracker/deploy.sh "$IMAGE" --registry-login-stdin

  verify:
    needs: [image, deploy]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.image.outputs.image }}
      SMOKE_BASE_URL: ${{ vars.PRODUCTION_URL }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Object storage works (writes, reads and deletes small test objects)
        run: docker run --rm -e S3_ENDPOINT -e S3_REGION -e S3_BUCKET -e S3_ACCESS_KEY_ID -e S3_SECRET_ACCESS_KEY "$IMAGE" node dist/cli/storage-check.js
      - name: Wait for the deployment to answer
        run: |
          if [ -z "$SMOKE_BASE_URL" ]; then
            echo "::notice::No PRODUCTION_URL variable: nothing to wait for."
            exit 0
          fi
          # The certificate is issued a moment after the first start of a new server.
          for _ in $(seq 1 40); do
            curl -fsS --max-time 10 "$SMOKE_BASE_URL/health/ready" >/dev/null && exit 0
            sleep 15
          done
          echo "::error::$SMOKE_BASE_URL did not become ready within ten minutes."
          exit 1
