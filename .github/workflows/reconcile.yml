name: storage-reconcile
# Brings the database and the object store back in line after crashes between the two: stale PENDING, FAILED and
# DELETING attachment rows, objects without a row (older than the cutoff), and a report of rows without an object.
# Runs the published image against production with the RUNTIME role (rows only), every night and by hand.
# Environment secrets: DATABASE_URL (runtime role), S3_ENDPOINT, S3_REGION, S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be done"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      # A scheduled run does the work; a manual run is a dry run unless it says otherwise.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      IMAGE: ghcr.io/${{ github.repository }}:latest
    steps:
      - name: Nothing to do before the first deployment
        id: ready
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$S3_ENDPOINT" ]; then
            echo "::notice::The production environment has no DATABASE_URL or S3 secrets yet."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconcile
        if: steps.ready.outputs.ready == 'true'
        run: |
          flags=""
          [ "$DRY_RUN" = "true" ] && flags="--dry-run"
          docker run --rm -e DATABASE_URL -e S3_ENDPOINT -e S3_REGION -e S3_BUCKET -e S3_ACCESS_KEY_ID -e S3_SECRET_ACCESS_KEY \
            "$IMAGE" node dist/cli/storage-reconcile.js $flags
