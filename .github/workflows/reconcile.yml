name: storage-reconcile
# Brings the database and the object store back in line after crashes between the two: stale PENDING, FAILED and
# DELETING attachment rows, objects without a row (older than the cutoff), and a report of rows without an object.
# Runs the published image, so it needs the same database and S3 settings as the application.
#
# Enable it once the deployment exists: set the repository variable RECONCILE_ENABLED=true and the secrets
# DATABASE_URL, S3_ENDPOINT, S3_REGION, S3_BUCKET, S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be done"
        type: boolean
        default: true

jobs:
  reconcile:
    if: ${{ vars.RECONCILE_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconcile
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          flags=""
          [ "$DRY_RUN" = "true" ] && flags="--dry-run"
          docker run --rm \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            -e S3_ENDPOINT="${{ secrets.S3_ENDPOINT }}" -e S3_REGION="${{ secrets.S3_REGION }}" -e S3_BUCKET="${{ secrets.S3_BUCKET }}" \
            -e S3_ACCESS_KEY_ID="${{ secrets.S3_ACCESS_KEY_ID }}" -e S3_SECRET_ACCESS_KEY="${{ secrets.S3_SECRET_ACCESS_KEY }}" \
            "ghcr.io/${{ github.repository }}:latest" node dist/cli/storage-reconcile.js $flags
