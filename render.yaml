# Render Blueprint: the production web service, started from the image that deploy.yml publishes to GHCR.
# Create it once: Render dashboard > New > Blueprint > pick this repository (branch main). Render asks for the values
# marked `sync: false` (they are secrets and never live in the repository). Details: README, "Render".
#
# Before that, add a registry credential named `ghcr` (Account Settings > Registry Credentials > GitHub Container
# Registry: your GitHub user and a token with the read:packages scope), because the image is private.
services:
  - type: web
    name: ticket-tracker
    runtime: image
    image:
      url: ghcr.io/vasilykamenev/ticket-tracker:latest
      creds:
        fromRegistryCreds:
          name: ghcr
    # Closest region to the Supabase project (London, eu-west-2).
    region: frankfurt
    plan: starter
    healthCheckPath: /health/ready
    # Deployments are started by the deploy workflow through the deploy hook, not by Render watching the registry:
    # that way a version is only deployed after CI, the migrations and the checks of the pipeline.
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      # One reverse proxy (Render's) sits in front of the application.
      - key: TRUST_PROXY
        value: "1"
      - key: MAX_CONCURRENT_UPLOADS
        value: "4"
      # https://<the service's address> (or the custom domain); used for the Origin check and secure cookies.
      - key: PUBLIC_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      # The RUNTIME role through the session pooler; never the migrator's URL.
      - key: DATABASE_URL
        sync: false
      # PEM text of Supabase's CA (multi-line values are fine in the dashboard).
      - key: DATABASE_CA_CERT
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
